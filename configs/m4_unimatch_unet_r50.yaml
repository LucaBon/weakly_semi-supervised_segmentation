# M4: UniMatch-style weak-to-strong consistency on N2 crops, with
# tag-constrained pseudo-labels, plus the tag loss
name: m4_unimatch_unet_r50
method: unimatch
model: {architecture: unet, encoder: resnet50, pretrained: true}
train: {batch_size: 4, unlabeled_batch_size: 4}
unimatch: {threshold: 0.95, car_threshold: 0.8, weight: 1.0}
eval: {filter_threshold: 0.5}
