[project]
name = "wsss"
version = "0.2.0"
description = "Weakly semi-supervised semantic segmentation on ISPRS Vaihingen"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch>=2.6",
    "torchvision>=0.21",
    "segmentation-models-pytorch>=0.4",
    "timm>=1.0",
    "numpy>=1.26",
    "scikit-image>=0.24",
    "tifffile>=2024.1",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "tensorboard>=2.17",
    "tqdm>=4.66",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wsss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
